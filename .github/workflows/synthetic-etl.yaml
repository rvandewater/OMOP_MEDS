name: Synthetic ETL for MESSY files using MESSY_synth

# Generates raw files straight from the shipped MESSY config with MESSY-synth and runs the ETL over
# them. MESSY-synth validates that every event block yields events and fails the job otherwise, so
# this catches expressions that only work on the dtypes of one particular release. It complements
# the Synthea and PhysioNet end-to-end tests in tests.yaml, which run the whole ETL on real OMOP CDM
# tables.
#
# The MESSY config reads the pre-MEDS tables that the `omop_pre_meds` pre-stage writes (concepts
# joined, times resolved), not the raw OMOP CDM tables, so that is what MESSY-synth generates. The
# run therefore skips `omop_pre_meds` and MEDS-Extract reads the synthetic tables from input_dir
# directly. `omop_codes_metadata` still runs but finds no pre-MEDS vocabulary tables, logs a warning
# and leaves metadata/codes.parquet as MEDS-Extract wrote it; `sumeds_enrich` runs as usual and
# never fails the run. OMOP_VERSION is not set because only `omop_pre_meds` reads it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/*", "dev", "feat/*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        # MESSY-synth requires Python >= 3.12.
        python-version: ["3.12", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --locked
          # MESSY_synth 0.1.0 is the first release that reads MEDS-Extract 0.8 configs.
          uv pip install "MESSY_synth==0.1.0"

      - name: Generate and extract synthetic data
        run: |
          uv run --no-sync MESSY-synth ./src/OMOP_MEDS/configs/event_configs.yaml -o raw_synthetic/ --explain
          uv run --no-sync meds-extract-run spec=OMOP output_dir=./OMOP_meds_synth \
            input_dir=raw_synthetic do_download=false 'skip_stages=[omop_pre_meds]'
          for f in dataset.json codes.parquet subject_splits.parquet; do
            test -f "OMOP_meds_synth/metadata/$f"
          done
