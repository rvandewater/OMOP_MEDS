name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/*", "dev"]

jobs:
  run_tests_ubuntu:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
      fail-fast: false

    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install packages
        run: |
          pip install -e '.[tests]'

      # test_e2e downloads the public MIMIC-IV OMOP demo from PhysioNet, which is slow and sometimes drops
      # connections. Keep the downloaded archive across runs: the key rotates weekly, and the package
      # itself re-downloads once the cached archive is older than download_cache_max_age_days (7).
      # Restore and save are separate steps so a successful download is saved even when a later test fails.
      - name: Week for demo cache key
        id: cache-week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore MIMIC-IV OMOP demo download
        id: demo-cache
        uses: actions/cache/restore@v4
        with:
          path: .omop-cache
          key: omop-demo-${{ steps.cache-week.outputs.week }}
          restore-keys: |
            omop-demo-

      #----------------------------------------------
      #              run test suite
      #----------------------------------------------
      - name: Run tests
        run: |
          pytest src/ tests/ -v --doctest-modules --cov=src --junitxml=junit.xml -s
        env:
          HYDRA_FULL_ERROR: 1
          OMOP_MEDS_CACHE_DIR: ${{ github.workspace }}/.omop-cache

      - name: Save MIMIC-IV OMOP demo download
        if: ${{ always() && steps.demo-cache.outputs.cache-hit != 'true' && hashFiles('.omop-cache/*.zip') != '' }}
        # Both matrix jobs share the key; whichever saves second only gets an "already exists" warning.
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .omop-cache
          key: omop-demo-${{ steps.cache-week.outputs.week }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
