name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/*", "dev"]
  # The PhysioNet end-to-end test (pytest marker `physionet`) is too slow and flaky from CI runners to gate
  # pull requests, so it runs on pushes to main, nightly and on demand; pull requests rely on the Synthea job.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  run_tests_ubuntu:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false

    # Room for test_e2e's PhysioNet download (25-minute budget, 28-minute test timeout).
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install packages
        run: |
          pip install -e '.[tests]'

      # test_e2e downloads the public MIMIC-IV OMOP demo from PhysioNet, which is slow and sometimes drops
      # connections. Keep the downloaded archive across runs: the key rotates weekly, and the package
      # itself re-downloads once the cached archive is older than download_cache_max_age_days (7).
      # Restore and save are separate steps so a successful download is saved even when a later test fails.
      - name: Week for demo cache key
        id: cache-week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore MIMIC-IV OMOP demo download
        id: demo-cache
        uses: actions/cache/restore@v4
        with:
          path: .omop-cache
          key: omop-demo-${{ steps.cache-week.outputs.week }}
          restore-keys: |
            omop-demo-

      #----------------------------------------------
      #              run test suite
      #----------------------------------------------
      - name: Run tests
        run: |
          pytest src/ tests/ -v --doctest-modules --cov=src --junitxml=junit.xml -s -m "$PYTEST_MARKERS"
        env:
          HYDRA_FULL_ERROR: 1
          OMOP_MEDS_CACHE_DIR: ${{ github.workspace }}/.omop-cache
          # Synthea has its own job below; PhysioNet is skipped on pull requests (see `on:` above).
          PYTEST_MARKERS: ${{ github.event_name == 'pull_request' && 'not physionet and not synthea' || 'not synthea' }}

      - name: Save MIMIC-IV OMOP demo download
        if: ${{ always() && steps.demo-cache.outputs.cache-hit != 'true' && hashFiles('.omop-cache/*.zip') != '' }}
        # All matrix jobs share the key; any that saves after the first only gets an "already exists" warning.
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .omop-cache
          key: omop-demo-${{ steps.cache-week.outputs.week }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  synthea_e2e:
    # End-to-end run over OHDSI's Synthea27Nj OMOP 5.4 sample (tests/e2e_synthea_test.py): synthetic data
    # served by GitHub, so it is fast and reliable enough to gate every pull request.
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false

    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install packages
        run: |
          pip install -e '.[tests]'

      - name: Cache Synthea27Nj archive
        uses: actions/cache@v4
        with:
          path: .synthea-cache
          # The archive is pinned by SHA-256 in the test, so its content never changes under this key; keep the
          # suffix in sync with SYNTHEA_ZIP_SHA256 (a mismatch only costs a ~1 s re-download).
          key: synthea27nj-5.4-cdd3971be325

      - name: Run Synthea end-to-end test
        run: |
          pytest tests/e2e_synthea_test.py -v -s -m synthea
        env:
          SYNTHEA_OMOP_CACHE_DIR: ${{ github.workspace }}/.synthea-cache
