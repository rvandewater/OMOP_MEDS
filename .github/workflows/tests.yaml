name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/*", "dev"]

jobs:
  run_tests_ubuntu:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
      fail-fast: false

    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install packages
        run: |
          pip install -e '.[tests]'

      # test_e2e downloads the public MIMIC-IV OMOP demo from PhysioNet, which is slow and sometimes drops
      # connections. Keep the downloaded archive across runs: the key rotates weekly, and the package
      # itself re-downloads once the cached archive is older than download_cache_max_age_days (7).
      - name: Week for demo cache key
        id: cache-week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache MIMIC-IV OMOP demo download
        uses: actions/cache@v4
        with:
          path: ~/.cache/OMOP_MEDS
          key: omop-demo-${{ steps.cache-week.outputs.week }}
          restore-keys: |
            omop-demo-

      #----------------------------------------------
      #              run test suite
      #----------------------------------------------
      - name: Run tests
        run: |
          pytest src/ tests/ -v --doctest-modules --cov=src --junitxml=junit.xml -s
        env:
          HYDRA_FULL_ERROR: 1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
