# Pre-MEDS settings shared by every OMOP CDM version. Table preprocessing is per version, in
# omop_<version>.yaml next to this file.
subject_id: "person_id"
admission_id: "visit_occurrence_id"
raw_data_extensions: ["*.parquet", "*.csv", "*.csv.gz"]
metadata_cols_to_drop: # optional, removes metadata columns when scanning (lazily loading) — omit key to skip
  columns: []
  patterns: ["(?i)xtn_", "(?i)etl_", "(?i)air_"]
