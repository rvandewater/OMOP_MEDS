defaults:
  - _self_

root_output_dir: ???
tables_to_ignore:
  [
    "note_nlp",
    "fact_relationship",
    "location",
    "care_site",
    "provider",
    "payer_plan_period",
    "cost",
    "metadata",
    "cdm_source",
    "concept_class",
    "cohort_definition",
    "attribute_definition",
    "attribute_definition",
    "cohort_definition",
    "vocabulary",
    "cdm_source",
    "vocabulary",
    "concept_ancestor",
    "concept_relationship",
  ]
prefer_source: False
raw_input_dir: ${root_output_dir}/raw_input
pre_MEDS_dir: ${root_output_dir}/pre_MEDS
MEDS_cohort_dir: ${root_output_dir}/MEDS_cohort
join_on_visit: False

# Selective low-memory input batching for very large parquet input.
pre_meds_chunked_tables: ["measurement", "observation", "note"]
pre_meds_batching_row_threshold: 10000000
pre_meds_batch_mode: auto
pre_meds_batch_size_shards: 1
pre_meds_batch_input_rows: 10000000

stage_runner_fp: null

do_download: False
do_overwrite: False
do_demo: False
# Cache for the public demo download (do_demo=True only); a cached archive is reused for
# download_cache_max_age_days days. Set download_cache_dir=null to always download.
download_cache_dir: ${oc.env:OMOP_MEDS_CACHE_DIR,"~/.cache/OMOP_MEDS"}
download_cache_max_age_days: 7

log_dir: ${root_output_dir}/.logs

# Hydra
hydra:
  job:
    name: full_extraction_${now:%Y-%m-%d_%H-%M-%S}
  run:
    dir: ${log_dir}
  sweep:
    dir: ${log_dir}
