# MESSY event conversion config (MEDS-Extract >= 0.7); every value is a dftly expression.
#
# Every interpolated code component is coalesced with `?? 'UNK'`. MEDS-Extract < 0.7 rendered a null component
# as "UNK" (e.g. `OMOP_visit_occurrence//UNK//start` for a visit with no mapped concept); from 0.7 a null
# component nulls the whole code and the row is dropped. Without the fallback, unmapped observations and, in
# datasets whose visit concepts lack names, every visit event would be dropped, reported only in the
# per-stage logs under MEDS_cohort/convert_to_MEDS_events/.logs.
_defaults:
  subject_id: $person_id

person_birth_death:
  death_time:
    code: MEDS_DEATH
    time: $date_of_death
    table_name: $table_name
  age:
    code: MEDS_BIRTH
    time: $date_of_birth
    table_name: $table_name
  gender:
    code: f"GENDER//{$gender ?? 'UNK'}"
    time: null
    table_name: $table_name

person:
  race:
    code: f"RACE//{$race_concept_id ?? 'UNK'}"
    time: null
    table_name: $table_name
  ethnicity:
    code: f"ETHNICITY//{$ethnicity_concept_id ?? 'UNK'}"
    time: null
    table_name: $table_name

observation:
  observation:
    code: f"{$preferred_vocabulary_name ?? 'UNK'}//{$preferred_concept_name ?? 'UNK'}"
    time: $observation_datetime
    numeric_value: $value_as_number
    unit: $unit_concept_id
    text_value: $value_as_string
    visit_occurrence_id: $visit_occurrence_id
    table_name: $table_name

measurement:
  measurement:
    code: f"{$preferred_vocabulary_name ?? 'UNK'}//{$preferred_concept_name ?? 'UNK'}"
    time: $measurement_datetime
    numeric_value: $value_as_number
    unit: $unit_concept_id
    visit_occurrence_id: $visit_occurrence_id
    table_name: $table_name

visit_occurrence:
  visit:
    code: f"{$preferred_vocabulary_name ?? 'UNK'}//{$preferred_concept_name ?? 'UNK'}//start"
    time: $visit_start_datetime
    visit_occurrence_id: $visit_occurrence_id
    text_value: $care_site_name
    table_name: $table_name
  visit_end:
    code: f"{$preferred_vocabulary_name ?? 'UNK'}//{$preferred_concept_name ?? 'UNK'}//end"
    time: $visit_end_datetime
    visit_occurrence_id: $visit_occurrence_id
    table_name: $table_name

observation_period:
  observation_period:
    code: f"{$preferred_vocabulary_name ?? 'UNK'}//{$preferred_concept_name ?? 'UNK'}//start"
    time: $observation_period_start_date
    table_name: $table_name
  observation_period_end:
    code: f"{$preferred_vocabulary_name ?? 'UNK'}//{$preferred_concept_name ?? 'UNK'}//end"
    time: $observation_period_end_date
    table_name: $table_name

drug_exposure:
  drug_exposure:
    code: f"{$preferred_vocabulary_name ?? 'UNK'}//{$drug_concept_id ?? 'UNK'}//start"
    time: $drug_exposure_start_datetime
    numeric_value: $quantity
    visit_occurrence_id: $visit_occurrence_id
    table_name: $table_name
  drug_exposure_end:
    code: f"{$preferred_vocabulary_name ?? 'UNK'}//{$drug_concept_id ?? 'UNK'}//end"
    time: $drug_exposure_end_datetime
    visit_occurrence_id: $visit_occurrence_id
    table_name: $table_name

specimen:
  specimen:
