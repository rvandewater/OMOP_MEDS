    unit: $unit_concept_id
    visit_occurrence_id: $visit_occurrence_id
    table_name: $table_name

visit_occurrence:
  visit:
    code: f"{$preferred_vocabulary_name ?? 'UNK'}//{$preferred_concept_name ?? 'UNK'}//start"
    time: $visit_start_datetime
    visit_occurrence_id: $visit_occurrence_id
    text_value: $care_site_name
    table_name: $table_name
  visit_end:
    code: f"{$preferred_vocabulary_name ?? 'UNK'}//{$preferred_concept_name ?? 'UNK'}//end"
    time: $visit_end_datetime
    visit_occurrence_id: $visit_occurrence_id
    table_name: $table_name

observation_period:
  observation_period:
    code: f"{$preferred_vocabulary_name ?? 'UNK'}//{$preferred_concept_name ?? 'UNK'}//start"
    time: $observation_period_start_date
    table_name: $table_name
  observation_period_end:
    code: f"{$preferred_vocabulary_name ?? 'UNK'}//{$preferred_concept_name ?? 'UNK'}//end"
    time: $observation_period_end_date
    table_name: $table_name

drug_exposure:
