    time: $condition_era_start_date
    numeric_value: $condition_occurrence_count
    table_name: $table_name
  condition_era_end:
    code: f"{$preferred_vocabulary_name ?? 'UNK'}//{$preferred_concept_name ?? 'UNK'}//end"
    time: $condition_era_end_date
    numeric_value: $condition_occurrence_count
    table_name: $table_name

note:
  note:
    code: f"{$preferred_vocabulary_name ?? 'UNK'}//{$preferred_concept_name ?? 'UNK'}"
    time: $preferred_time
    text_value: $note_title
    visit_occurrence_id: $visit_occurrence_id
    table_name: $table_name
    link_id: $note_id
